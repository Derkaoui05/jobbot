name: jobbot
on:
  schedule: [{cron: "0 7 * * *"}]   # daily 07:00 UTC
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python main.py run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: persist DB   # keep this repo PRIVATE
        run: |
          git config user.name jobbot && git config user.email jobbot@users.noreply.github.com
          git add -f jobs.db && git commit -m "update jobs" || true
          git push
